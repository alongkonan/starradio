<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Radio เปลี่ยนเป็น VIBE 24</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Montserrat & Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vibe: {
                            red: '#E31E24',
                            black: '#000000',
                            grey: '#333333',
                        }
                    },
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                        montserrat: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }

        // Redirect Logic
        let timeLeft = 5;
        const targetUrl = "https://vibe247.vercel.app/";

        function startCountdown() {
            const countdownEl = document.getElementById('countdown');
            const timer = setInterval(() => {
                timeLeft--;
                if (countdownEl) countdownEl.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    window.location.href = targetUrl;
                }
            }, 1000);
        }

        window.onload = startCountdown;
    </script>

    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
        }
        
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        .delay-100 { animation-delay: 0.1s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-500 { animation-delay: 0.5s; }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .pulse-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150vw;
            height: 150vh;
            background: radial-gradient(circle, rgba(227, 30, 36, 0.15) 0%, rgba(0,0,0,0) 60%);
            z-index: -1;
            animation: pulse 4s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center relative p-6">

    <!-- Background Effect -->
    <div class="pulse-bg"></div>

    <main class="max-w-md w-full text-center space-y-8 z-10">
        
        <!-- Old Brand (Fading Out visual) -->
        <div class="fade-in-up space-y-2 opacity-50 grayscale hover:grayscale-0 transition-all duration-500">
            <h2 class="text-xl text-gray-400 font-medium">Star Radio</h2>
            <p class="text-sm text-gray-500">กำลังเปลี่ยนโฉมใหม่...</p>
        </div>

        <!-- Transition Icon -->
        <div class="fade-in-up delay-100 flex justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-vibe-red animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
            </svg>
        </div>

        <!-- New Brand (VIBE 24) -->
        <div class="fade-in-up delay-300 flex flex-col items-center gap-4">
            <img src="https://img2.pic.in.th/1000074512.png" alt="VIBE 24 Logo" class="w-40 h-auto object-contain drop-shadow-[0_0_15px_rgba(227,30,36,0.3)]">
            <div>
                <h1 class="text-4xl font-extrabold font-montserrat tracking-tight text-white mb-1">
                    VIBE <span class="text-vibe-red">24</span>
                </h1>
                <p class="text-gray-300 font-light text-sm">คลื่นเพลงฮิต...ต่อเนื่อง 24 ชั่วโมง</p>
            </div>
        </div>

        <!-- Redirect Info -->
        <div class="fade-in-up delay-500 mt-12 p-6 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-md">
            <p class="text-gray-300 mb-4 font-light">
                เรากำลังพาคุณไปที่บ้านหลังใหม่ใน <br>
                <span class="text-3xl font-bold text-vibe-red font-montserrat" id="countdown">5</span> วินาที
            </p>
            
            <a href="https://vibe247.vercel.app/" class="inline-flex items-center justify-center gap-2 w-full py-3 px-6 rounded-xl bg-vibe-red hover:bg-red-700 text-white font-bold transition-all shadow-lg shadow-vibe-red/20 group">
                <span>ไปที่ VIBE 24 ทันที</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </a>
        </div>

    </main>

    <footer class="absolute bottom-4 text-[10px] text-gray-600 font-montserrat">
        &copy; 2026 VIBE 24 STATION
    </footer>

</body>
</html>
