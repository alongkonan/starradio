<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Radio - Online Station</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Kanit (Thai) -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #0f172a;
            color: white;
            overflow-x: hidden;
        }

        /* Animation for Stars Background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: -2;
            opacity: 0.2; 
            background: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                        radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
                        radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
        }

        /* Glassmorphism Card */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* Artwork Styling */
        #artwork-image {
            width: 100%;
            max-width: 350px; 
            height: auto;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            margin: 0 auto;
            display: block;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .art-shrink {
            max-width: 220px !important; 
        }
        
        @media (min-width: 1024px) {
            #artwork-image {
                max-width: 450px; 
            }
            .art-shrink {
                max-width: 320px !important; 
            }
        }
        
        .is-playing #artwork-image {
            animation: pulse-art 2s infinite;
        }

        @keyframes pulse-art {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.7); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(168, 85, 247, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); }
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none; 
            background: transparent; 
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -6px; 
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
        }
        
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
        }

        /* Equalizer Animation */
        .equalizer {
            display: flex;
            align-items: flex-end;
            height: 20px;
            gap: 2px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .is-playing .equalizer {
            opacity: 1;
        }
        .bar {
            width: 4px;
            background: #a855f7;
            animation: bounce 1s infinite ease-in-out;
        }
        .bar:nth-child(1) { animation-duration: 0.8s; height: 40%; }
        .bar:nth-child(2) { animation-duration: 1.1s; height: 70%; }
        .bar:nth-child(3) { animation-duration: 0.9s; height: 50%; }
        .bar:nth-child(4) { animation-duration: 1.2s; height: 80%; }
        .bar:nth-child(5) { animation-duration: 0.7s; height: 60%; }

        @keyframes bounce {
            0%, 100% { height: 20%; }
            50% { height: 100%; }
        }

        /* Marquee Text Animation */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            box-sizing: border-box;
        }
        
        .marquee-content {
            display: inline-block;
            animation: marquee 15s linear infinite;
            padding-left: 100%;
            color: white; 
        }

        .song-title-wrapper {
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative p-4 bg-gradient-to-br from-slate-900 via-purple-950 to-black overflow-y-auto py-8 lg:py-0">

    <!-- Starry Background -->
    <div class="stars"></div>

    <!-- Layout Container (Responsive Grid) -->
    <main class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-6 items-center relative z-10">

        <!-- LEFT COLUMN: Main Player -->
        <div class="col-span-12 lg:col-span-7 xl:col-span-8">
            <div class="glass-panel w-full rounded-3xl p-6 md:p-8 flex flex-col lg:flex-row items-center gap-6 lg:gap-10 transition-all duration-300">
                
                <!-- Left: Artwork Section -->
                <div class="w-full lg:w-auto flex-shrink-0 flex flex-col items-center">
                    <div id="artwork-wrapper" class="w-full flex justify-center lg:block">
                         <div id="artwork-container" class="flex justify-center">
                             <img id="artwork-image" src="https://i.postimg.cc/8cBPtCd1/logo-new.png" alt="Album Art">
                         </div>
                    </div>
                </div>

                <!-- Right: Controls & Info Section -->
                <div class="w-full flex flex-col items-center lg:items-start lg:flex-1 space-y-4">
                    
                    <!-- Header -->
                    <div class="w-full flex justify-between items-center lg:mb-2">
                        <div class="flex items-center gap-2">
                            <span class="flex h-3 w-3 relative">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                            </span>
                            <span class="text-xs font-semibold tracking-widest text-red-400 uppercase">Live</span>
                        </div>
                        <img src="https://i.postimg.cc/8cBPtCd1/logo-new.png" alt="Star Radio Logo" class="h-10 lg:h-12 object-contain drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]">
                    </div>

                    <!-- Song Info -->
                    <div class="w-full space-y-1 lg:space-y-2">
                        
                        <!-- Artist Name -->
                        <div class="w-full text-center lg:text-left">
                            <p id="track-artist" class="text-lg text-purple-300 font-medium truncate">
                                Star Radio
                            </p>
                        </div>

                        <!-- Current Song Title -->
                        <div class="w-full relative flex items-center justify-center lg:justify-start">
                            <h2 id="track-title" class="text-2xl md:text-4xl font-bold text-white text-center lg:text-left leading-tight line-clamp-2 transition-all duration-300">
                                Online Station
                            </h2>
                        </div>
                        
                        <!-- Next Song -->
                        <div class="flex items-center justify-center lg:justify-start w-full pt-2">
                            <div class="flex items-center gap-2 text-sm text-gray-300 bg-black/30 py-1.5 px-4 rounded-full w-full max-w-sm lg:max-w-md border border-white/5 overflow-hidden">
                                <span class="text-purple-400 font-semibold whitespace-nowrap flex-shrink-0 z-10 bg-black/10">ถัดไป:</span>
                                <div class="marquee-container w-full h-6 flex items-center">
                                    <span class="marquee-content" style="animation-duration: 12s;">
                                        <script src="https://embed.radio.co/embed/sbf4f79825/next.js"></script>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Audio Player Controls -->
                    <div class="w-full flex flex-col items-center lg:items-start gap-6 mt-2">
                        <div class="flex items-center justify-center lg:justify-start gap-8 w-full">
                            <div class="equalizer h-8 w-12 hidden md:flex lg:hidden">
                                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                            </div>

                            <button id="play-btn" class="group relative flex items-center justify-center w-20 h-20 rounded-full bg-gradient-to-tr from-purple-600 to-indigo-500 hover:from-purple-500 hover:to-indigo-400 text-white shadow-lg hover:shadow-purple-500/50 transition-all duration-300 transform hover:scale-105 active:scale-95">
                                <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 ml-1" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M8 5v14l11-7z"/>
                                </svg>
                                <svg id="icon-pause" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 hidden" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                                </svg>
                            </button>

                            <div class="equalizer h-12 w-16 hidden lg:flex gap-[3px]">
                                <div class="bar w-1.5"></div><div class="bar w-1.5"></div><div class="bar w-1.5"></div><div class="bar w-1.5"></div><div class="bar w-1.5"></div><div class="bar w-1.5"></div>
                            </div>
                        </div>

                        <div class="w-full flex items-center gap-3 px-4 lg:px-0 max-w-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                            </svg>
                            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: Sidebar (DJ Card) -->
        <div class="col-span-12 lg:col-span-5 xl:col-span-4 flex flex-col gap-6">
            
            <!-- DJ Profile Card -->
            <div id="dj-card" class="w-full relative rounded-[24px] lg:rounded-[32px] overflow-hidden shadow-[0_8px_30px_rgba(0,0,0,0.2)] group transition-all duration-300 hover:shadow-[0_20px_40px_rgba(0,0,0,0.4)] bg-gray-900">
                
                <!-- Responsive Wrapper: Flex Row (Mobile) / Block (Desktop) -->
                <div class="flex flex-row lg:block relative h-full">
                    
                    <!-- Image Container -->
                    <div class="w-[120px] sm:w-[140px] lg:w-full aspect-[3/4] lg:aspect-[3/4] relative flex-shrink-0">
                        <img id="dj-image" src="https://i.postimg.cc/8cBPtCd1/logo-new.png" alt="DJ Station" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" style="object-position: top;">
                        
                        <!-- Gradient Overlay (Desktop Only) -->
                        <div class="hidden lg:block absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/40 to-transparent"></div>
                        
                        <!-- Status Badge (Desktop Only: In Image) -->
                        <div class="hidden lg:block absolute top-4 right-4 z-10">
                            <span id="dj-status-badge-desktop" class="text-xs font-bold px-3 py-1 rounded-full bg-red-600/90 text-white shadow-lg backdrop-blur-sm animate-pulse border border-white/10">ON AIR</span>
                        </div>
                    </div>

                    <!-- Content Container -->
                    <div class="flex-1 p-4 flex flex-col justify-center lg:absolute lg:bottom-0 lg:left-0 lg:w-full lg:p-6 lg:justify-end z-10 relative">
                        <!-- Status Badge (Mobile Only: In Content Area) -->
                        <div class="lg:hidden absolute top-3 right-3 z-10">
                            <span id="dj-status-badge-mobile" class="text-[10px] font-bold px-2 py-1 rounded-full bg-red-600/90 text-white shadow-lg backdrop-blur-sm animate-pulse border border-white/10">ON AIR</span>
                        </div>

                        <h3 id="dj-name" class="font-bold text-xl lg:text-4xl text-white leading-tight lg:leading-none tracking-tight mb-1 lg:mb-2 drop-shadow-lg line-clamp-1 lg:line-clamp-none pr-14 lg:pr-0">STAR RADIO</h3>
                        
                        <div class="flex flex-wrap items-center gap-2 mb-0 lg:mb-4">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-white/20 text-white border border-white/10 backdrop-blur-md hidden lg:inline-block">HOST</span>
                            <p id="dj-time" class="text-sm lg:text-lg text-purple-300 font-medium tracking-wide drop-shadow-md">Non-stop Hits</p>
                        </div>
                        
                        <div class="hidden lg:block w-full h-[1px] bg-white/10 mb-3"></div>
                        <div class="hidden lg:flex items-center justify-end w-full">
                            <img src="https://i.postimg.cc/8cBPtCd1/logo-new.png" class="h-4 w-auto opacity-70">
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Mobile Footer -->
        <div class="col-span-12 mt-4 lg:mt-0 text-center text-xs text-gray-500 w-full pt-4 border-t border-white/10 lg:border-none">
            <p>&copy; 2024 Star Radio. All rights reserved.</p>
        </div>

    </main>

    <!-- Audio Element -->
    <audio id="radio-player" preload="none">
        Browser ของคุณไม่รองรับการเล่นเสียง
    </audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const STATION_ID = "sbf4f79825"; 

            // --- DJ SCHEDULE CONFIGURATION ---
            const djSchedule = [
                {
                    day: 6, 
                    start: 9, 
                    end: 15,  
                    name: "DJ KRIT",
                    timeLabel: "SAT 09.00-15.00",
                    image: "https://lh3.googleusercontent.com/d/1c7-F8m-Q51qCx7oRLSa6zYhXsKKVAocA"
                },
                {
                    day: 6, 
                    start: 15,
                    end: 19,
                    name: "DJ MAN",
                    timeLabel: "SAT 15.00-19.00",
                    image: "https://lh3.googleusercontent.com/d/1ZQLeVFc6S4ARJwLdlcFS-yyPPwQGzV8M"
                }
            ];
            const defaultDJ = {
                name: "STAR RADIO",
                timeLabel: "Non-stop Hits",
                image: "https://i.postimg.cc/8cBPtCd1/logo-new.png" 
            };

            const urls = {
                stream: `https://streaming.radio.co/${STATION_ID}/listen`,
                status: `https://public.radio.co/stations/${STATION_ID}/status`,
                nextScript: `https://embed.radio.co/embed/${STATION_ID}/next.js`
            };
            const defaultArtwork = "https://i.postimg.cc/8cBPtCd1/logo-new.png";

            const player = document.getElementById('radio-player');
            const playBtn = document.getElementById('play-btn');
            const iconPlay = document.getElementById('icon-play');
            const iconPause = document.getElementById('icon-pause');
            const volumeSlider = document.getElementById('volume-slider');
            
            const artworkImage = document.getElementById('artwork-image');
            const trackArtistEl = document.getElementById('track-artist');
            const trackTitleEl = document.getElementById('track-title');
            
            const djImageEl = document.getElementById('dj-image');
            const djNameEl = document.getElementById('dj-name');
            const djTimeEl = document.getElementById('dj-time');
            
            // Select both badges (Mobile & Desktop)
            const djStatusBadges = [
                document.getElementById('dj-status-badge-desktop'),
                document.getElementById('dj-status-badge-mobile')
            ];

            let isPlaying = false;

            // --- DJ SCHEDULE LOGIC ---
            function updateDJCard() {
                const now = new Date();
                const day = now.getDay();
                const hour = now.getHours();
                
                let currentShow = null;

                for (const show of djSchedule) {
                    if (show.day === day && hour >= show.start && hour < show.end) {
                        currentShow = show;
                        break;
                    }
                }

                // Prepare new values
                let newName = defaultDJ.name;
                let newTime = defaultDJ.timeLabel;
                let newImage = defaultDJ.image;
                let isLive = false;

                if (currentShow) {
                    newName = currentShow.name;
                    newTime = currentShow.timeLabel;
                    newImage = currentShow.image;
                    isLive = true;
                }

                // Update DOM only if changed (simple check)
                if (djNameEl.textContent !== newName) {
                    djNameEl.textContent = newName;
                    djTimeEl.textContent = newTime;
                    djImageEl.src = newImage;
                    
                    if (isLive) {
                        djImageEl.style.objectFit = "cover";
                        djImageEl.style.objectPosition = "top"; 
                    } else {
                        djImageEl.style.objectFit = "contain"; 
                        djImageEl.style.objectPosition = "center";
                    }

                    // Update all badges
                    djStatusBadges.forEach(badge => {
                        if (badge) {
                            if (isLive) {
                                badge.textContent = "ON AIR";
                                badge.classList.remove("bg-gray-600");
                                badge.classList.add("bg-red-600/90", "animate-pulse");
                            } else {
                                badge.textContent = "OFF AIR";
                                badge.classList.remove("bg-red-600/90", "animate-pulse");
                                badge.classList.add("bg-gray-600");
                            }
                        }
                    });
                }
            }

            player.addEventListener('error', function(e) {
                console.error("Audio Player Error:", e);
                if (isPlaying) {
                    console.log("Retrying stream connection...");
                    isPlaying = false;
                    iconPlay.classList.remove('hidden');
                    iconPause.classList.add('hidden');
                    document.body.classList.remove('is-playing');
                    alert("ไม่สามารถเชื่อมต่อสัญญาณเสียงได้ในขณะนี้");
                }
            });

            // --- 1. DATA FETCHING ---
            async function updateTrackData() {
                let artworkUrl = defaultArtwork;
                let fullTitle = "Star Radio - Online Station";
                let artist = "Star Radio";
                let title = "Online Station";

                try {
                    const response = await fetch(`${urls.status}?t=${Date.now()}`);
                    if (response.ok) {
                        const data = await response.json();
                        const track = data.current_track || {};
                        
                        if (track.title) fullTitle = track.title;
                        
                        if (track.artwork_url_large && track.artwork_url_large !== 'null') {
                            artworkUrl = track.artwork_url_large;
                        } else if (track.artwork_url && track.artwork_url !== 'null') {
                            artworkUrl = track.artwork_url;
                        }
                    }
                } catch (e) { console.log("API Fetch failed, using defaults"); }

                if (fullTitle.includes(" - ")) {
                    const parts = fullTitle.split(" - ");
                    artist = parts[0];
                    title = parts.slice(1).join(" - ");
                } else {
                    title = fullTitle;
                    if (artist === "Star Radio" && fullTitle !== "Star Radio - Online Station") {
                        artist = "Now Playing";
                    }
                }

                if (trackArtistEl) trackArtistEl.textContent = artist;
                if (trackTitleEl) {
                    trackTitleEl.textContent = title;
                    if (artworkImage) {
                        if (title.length > 20) {
                            artworkImage.classList.add('art-shrink');
                        } else {
                            artworkImage.classList.remove('art-shrink');
                        }
                    }
                }
                
                if (artworkImage && artworkImage.src !== artworkUrl) artworkImage.src = artworkUrl;

                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: title,
                        artist: artist,
                        album: "Star Radio Live",
                        artwork: [
                            { src: artworkUrl, sizes: '512x512', type: 'image/jpeg' },
                            { src: artworkUrl, sizes: '96x96', type: 'image/jpeg' }
                        ]
                    });
                }
            }

            // --- 2. PLAYER CONTROLS ---
            function togglePlay() {
                if (isPlaying) {
                    player.pause();
                    player.src = ""; 
                    player.load();
                    
                    isPlaying = false;
                    iconPlay.classList.remove('hidden');
                    iconPause.classList.add('hidden');
                    document.body.classList.remove('is-playing');
                    
                    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "paused";
                } else {
                    player.src = urls.stream; 
                    player.load();
                    
                    const playPromise = player.play();
                    
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            isPlaying = true;
                            iconPlay.classList.add('hidden');
                            iconPause.classList.remove('hidden');
                            document.body.classList.add('is-playing');
                            
                            updateTrackData();
                            
                            if ('mediaSession' in navigator) {
                                navigator.mediaSession.playbackState = "playing";
                                navigator.mediaSession.setActionHandler('play', togglePlay);
                                navigator.mediaSession.setActionHandler('pause', togglePlay);
                            }
                        }).catch(error => {
                            console.error("Playback failed:", error);
                            if (error.name !== 'AbortError') {
                                alert("ไม่สามารถเล่นเพลงได้: " + error.message);
                            }
                        });
                    }
                }
            }

            playBtn.addEventListener('click', togglePlay);

            volumeSlider.addEventListener('input', (e) => {
                player.volume = e.target.value;
            });
            player.volume = 0.8;

            // --- 3. BACKGROUND TASKS ---
            updateTrackData(); 
            setInterval(updateTrackData, 10000); 
            
            updateDJCard();
            setInterval(updateDJCard, 60000);

            if (artworkImage) {
                artworkImage.onerror = function() {
                    if (this.src !== defaultArtwork) this.src = defaultArtwork;
                };
            }
        });
    </script>
</body>
</html>
